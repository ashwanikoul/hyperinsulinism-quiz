<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Congenital Hyperinsulinism Quiz — PIER &amp; UK National Consensus</title>
  <meta name="description" content="Zero-storage interactive clinical quiz game integrating the PIER Network Wessex CHI Guideline (v1.0) and the UK National Collaborative Consensus (Shaikh et al., Frontiers in Endocrinology 2023)." />
  <meta property="og:title" content="Congenital Hyperinsulinism Quiz — PIER &amp; UK National Consensus" />
  <meta property="og:description" content="Interactive mobile &amp; desktop clinical quiz on neonatal &amp; paediatric CHI: GIR math, hypo screens, genetics, glucagon, diazoxide, octreotide, feeds/MDT, surgery, CGM &amp; discharge. Saves zero data." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0b6e74" />
  <style>
    :root {
      --bg: #f4f7f8;
      --surface: #ffffff;
      --subtle: #edf3f5;
      --border: #d5e0e5;
      --border-strong: #a7bac2;
      --fg: #0f1c24;
      --muted: #506470;
      --primary: #0b6e74;
      --primary-fg: #ffffff;
      --primary-soft: rgba(11, 110, 116, 0.11);
      --secondary-accent: #1d5b8c;
      --secondary-soft: rgba(29, 91, 140, 0.11);
      --success: #15803d;
      --success-soft: rgba(21, 128, 61, 0.11);
      --success-border: rgba(21, 128, 61, 0.36);
      --warning: #b45309;
      --warning-soft: rgba(217, 119, 6, 0.12);
      --error: #dc2626;
      --error-soft: rgba(220, 38, 38, 0.10);
      --error-border: rgba(220, 38, 38, 0.35);
      --shadow-card: 0 1px 2px rgba(15, 28, 36, 0.04), 0 8px 24px -14px rgba(15, 28, 36, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c1419;
        --surface: #131f26;
        --subtle: #1a2a33;
        --border: #263a45;
        --border-strong: #3d5766;
        --fg: #edf4f7;
        --muted: #9cb0bc;
        --primary: #2bb3ba;
        --primary-fg: #062124;
        --primary-soft: rgba(43, 179, 186, 0.16);
        --secondary-accent: #60a5fa;
        --secondary-soft: rgba(96, 165, 250, 0.16);
        --success: #4ade80;
        --success-soft: rgba(74, 222, 128, 0.13);
        --success-border: rgba(74, 222, 128, 0.38);
        --warning: #fbbf24;
        --warning-soft: rgba(251, 191, 36, 0.14);
        --error: #f87171;
        --error-soft: rgba(248, 113, 113, 0.14);
        --error-border: rgba(248, 113, 113, 0.38);
        --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.32);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    button, input {
      font-family: inherit;
      touch-action: manipulation;
    }

    h1, h2, h3, p, ul {
      margin: 0;
    }

    .app-shell {
      max-width: 740px;
      margin: 0 auto;
      padding: 16px 16px 48px;
    }

    @media (min-width: 640px) {
      .app-shell {
        padding: 28px 24px 60px;
      }
    }

    /* Layout utilities */
    .stack-xs > * + * { margin-top: 6px; }
    .stack-sm > * + * { margin-top: 10px; }
    .stack-md > * + * { margin-top: 14px; }
    .stack-lg > * + * { margin-top: 20px; }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .row-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .flex-1 { flex: 1 1 0%; }
    .shrink-0 { flex-shrink: 0; }

    /* Typography */
    .eyebrow {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primary);
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .title-xl {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.22;
    }

    @media (min-width: 640px) {
      .title-xl {
        font-size: 30px;
      }
    }

    .title-md {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.38;
    }

    @media (min-width: 640px) {
      .title-md {
        font-size: 18px;
      }
    }

    .body-sm {
      font-size: 14px;
      line-height: 1.55;
    }

    .body-xs {
      font-size: 12px;
      line-height: 1.45;
    }

    .text-muted { color: var(--muted); }
    .text-primary { color: var(--primary); }
    .text-success { color: var(--success); }
    .text-error { color: var(--error); }
    .text-warning { color: var(--warning); }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .tabular { font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Surfaces */
    .surface-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      padding: 20px;
    }

    @media (min-width: 640px) {
      .surface-card {
        padding: 26px;
      }
    }

    .surface-subtle {
      background-color: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 15px;
    }

    .divider-top {
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--primary);
      color: var(--primary-fg);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn-primary:hover:not(:disabled) { opacity: 0.92; }
    .btn-primary:active:not(:disabled) { transform: scale(0.985); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--subtle);
      border-color: var(--border-strong);
    }

    .btn-secondary:active:not(:disabled) { transform: scale(0.985); }

    .btn-link {
      background: transparent;
      border: 0;
      padding: 0;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
    }

    .btn-full-mobile { width: 100%; }

    @media (min-width: 640px) {
      .btn-full-mobile { width: auto; }
    }

    /* Mode cards */
    .mode-card {
      width: 100%;
      text-align: left;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background-color: var(--surface);
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: border-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
    }

    .mode-card:hover {
      border-color: var(--primary);
      box-shadow: 0 6px 20px -12px rgba(11, 110, 116, 0.35);
      transform: translateY(-1px);
    }

    .mode-card:active { transform: scale(0.99); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-primary { background-color: var(--primary-soft); color: var(--primary); }
    .badge-secondary { background-color: var(--secondary-soft); color: var(--secondary-accent); }
    .badge-success { background-color: var(--success-soft); color: var(--success); }
    .badge-neutral { background-color: var(--subtle); color: var(--muted); }

    /* Filter chips */
    .chip-btn {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .chip-btn:hover {
      border-color: var(--primary);
      color: var(--fg);
    }

    .chip-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: var(--primary-fg);
    }

    /* Quiz answer options */
    .option-btn {
      width: 100%;
      text-align: left;
      min-height: 54px;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background-color: var(--surface);
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14.5px;
      line-height: 1.45;
      transition: border-color 0.14s ease, background-color 0.14s ease, transform 0.1s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: var(--subtle);
    }

    .option-btn:active:not(:disabled) { transform: scale(0.99); }
    .option-btn:disabled { cursor: default; }

    .option-btn.selected { border-color: var(--primary); background-color: var(--primary-soft); }
    .option-btn.correct { border-color: var(--success); background-color: var(--success-soft); }
    .option-btn.incorrect { border-color: var(--error); background-color: var(--error-soft); }
    .option-btn.missed { border-color: var(--warning); border-style: dashed; background-color: var(--warning-soft); }

    .option-key {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      margin-top: 1px;
      color: var(--muted);
      background-color: var(--subtle);
    }

    .option-btn.selected .option-key { background-color: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
    .option-btn.correct .option-key { background-color: var(--success); border-color: var(--success); color: #ffffff; }
    .option-btn.incorrect .option-key { background-color: var(--error); border-color: var(--error); color: #ffffff; }
    .option-btn.missed .option-key { background-color: var(--warning); border-color: var(--warning); color: #ffffff; }

    /* Progress & Timer */
    .sticky-hud {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 0 12px;
      background-color: var(--bg);
    }

    .progress-track {
      height: 6px;
      border-radius: 999px;
      background-color: var(--subtle);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background-color: var(--primary);
      transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .timer-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.25s linear, background-color 0.25s ease;
    }

    /* Feedback */
    .feedback-box {
      border-radius: 12px;
      padding: 14px 16px;
      animation: fadeSlide 0.2s ease-out;
    }

    .feedback-correct { background-color: var(--success-soft); border: 1px solid var(--success-border); }
    .feedback-wrong { background-color: var(--error-soft); border: 1px solid var(--error-border); }

    /* Slider */
    .range-slider {
      width: 100%;
      height: 8px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .stat-box {
      background-color: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
    }

    @media (min-width: 640px) {
      .stat-num { font-size: 26px; }
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .kbd-hint { display: none; }

    @media (hover: hover) and (pointer: fine) {
      .kbd-hint { display: inline-flex; }
    }

    .view-enter { animation: fadeSlide 0.22s ease-out; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Quick Reference Modal */
    .ref-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 16, 22, 0.58);
      backdrop-filter: blur(3px);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    @media (min-width: 640px) {
      .ref-modal-backdrop { align-items: center; padding: 24px; }
    }

    .ref-modal-panel {
      width: 100%;
      max-width: 700px;
      max-height: 88dvh;
      overflow-y: auto;
      background-color: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    @media (min-width: 640px) {
      .ref-modal-panel { border-radius: 18px; padding: 24px; }
    }

    .ref-list {
      padding-left: 18px;
      margin-top: 6px;
      font-size: 13.5px;
      line-height: 1.55;
    }

    .ref-list li + li { margin-top: 5px; }

    a.ext-link {
      color: var(--primary);
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite"></main>

  <script>
    "use strict";

    /*
     * ZERO-STORAGE GUARANTEE:
     * This application intentionally uses ZERO persistent storage
     * (no localStorage, no sessionStorage, no cookies, no IndexedDB, no network telemetry).
     * All quiz state exists strictly in ephemeral memory for the current page session.
     *
     * CLINICAL SOURCES:
     * 1) PIER Network (Wessex Endocrine Network): Initial Assessment and Management of
     *    Congenital Hyperinsulinism in Neonates (v1.0, Approved 09/2024, Review 09/2027)
     * 2) Shaikh MG et al.: Standardised practices in the networked management of congenital
     *    hyperinsulinism: a UK national collaborative consensus. Front. Endocrinol. 2023;14:1231043.
     */

    const SOURCES = {
      pier: { id: "pier", label: "PIER Network v1.0", badgeClass: "badge-primary" },
      uk: { id: "uk", label: "UK Consensus 2023", badgeClass: "badge-secondary" },
      both: { id: "both", label: "PIER + UK Consensus", badgeClass: "badge-success" }
    };

    const DOMAINS = {
      definitions: { id: "definitions", label: "Definitions & GIR" },
      diagnosis: { id: "diagnosis", label: "Diagnosis & Genetics" },
      acute: { id: "acute", label: "Acute & Glucagon" },
      pharmacology: { id: "pharmacology", label: "Diazoxide & Octreotide" },
      nutrition: { id: "nutrition", label: "Feeds, Diet & MDT" },
      discharge: { id: "discharge", label: "Surgery, Discharge & CGM" }
    };

    const QUESTION_BANK = [
      /* 1. DEFINITIONS & GIR (5) */
      {
        id: "q1",
        domain: "definitions",
        source: "both",
        type: "mcq",
        section: "Pathophysiology & Brain Injury Risk",
        prompt: "Why does Congenital Hyperinsulinism (CHI) carry a particularly high risk of neurodisability compared with ketotic causes of hypoglycaemia?",
        options: [
          "Dysregulated insulin suppresses ketone body mobilisation, depriving the brain of both glucose and secondary ketone fuel",
          "Excess insulin triggers severe hyperosmolar cerebral dehydration alongside hypoglycaemia",
          "CHI prevents hepatic glycogen storage in utero so glucose falls immediately at cord clamping",
          "High circulating C-peptide directly crosses the blood–brain barrier and triggers neonatal seizures"
        ],
        answer: 0,
        pearl: "Inappropriate pancreatic β-cell insulin secretion inhibits lipolysis and ketogenesis during hypoglycaemia, starving the brain of both glucose and ketones. Both PIER and the UK Consensus stress prompt control to prevent neuroglycopaenic brain injury (25–50% risk of seizures/neurodevelopmental sequelae)."
      },
      {
        id: "q2",
        domain: "definitions",
        source: "both",
        type: "slider",
        section: "Glucose Infusion Rate Threshold",
        prompt: "While normal newborn glucose requirements are 4–6 mg/kg/min, above what Glucose Infusion Rate (GIR) is excessive and strongly suggestive of CHI?",
        unit: "mg/kg/min",
        prefix: ">",
        min: 4,
        max: 16,
        step: 1,
        defaultVal: 10,
        answer: 8,
        tolerance: 0,
        pearl: "Both PIER and the UK National Consensus specify a normal neonatal GIR of 4–6 mg/kg/min and > 8 mg/kg/min as excessive and suggestive of CHI. Handy bedside rule (UK Consensus): 10% dextrose at 5 mL/kg/hr (120 mL/kg/day) already equals a GIR of 8.3 mg/kg/min."
      },
      {
        id: "q3",
        domain: "definitions",
        source: "both",
        type: "mcq",
        section: "Diagnostic & Therapeutic Glucose Thresholds",
        prompt: "What operational blood glucose threshold triggers investigation for CHI, and what practical therapeutic target is agreed across both PIER and the UK National Consensus?",
        options: [
          "Investigate ≤ 2.6 mmol/L; treat to maintain > 3.0 mmol/L",
          "Investigate ≤ 3.0 mmol/L; treat to maintain ≥ 3.5 mmol/L",
          "Investigate ≤ 3.3 mmol/L; treat to maintain ≥ 4.5 mmol/L",
          "Investigate ≤ 2.0 mmol/L; treat to maintain ≥ 3.5 mmol/L"
        ],
        answer: 1,
        pearl: "The UK Consensus chose 3.0 mmol/L as a pragmatic operational cut-off between 2.6 and 3.3 mmol/L (avoiding over-diagnosing benign transitional lows), and ≥ 3.5 mmol/L as the practical treatment target (aspirational > 4.0 mmol/L balanced against overtreatment side effects)."
      },
      {
        id: "q4",
        domain: "definitions",
        source: "pier",
        type: "mcq",
        section: "Worked GIR Example • Enteral Milk",
        vignette: "A 3.0 kg term neonate is receiving 120 mL/kg/day of Nutriprem 1 (carbohydrate concentration 8.4 g/100 mL).",
        prompt: "What is this baby's Glucose Infusion Rate (GIR)?",
        formulaHint: "Rate (mL/hr) = (mL/kg/day × kg) ÷ 24  |  GIR = (% carb × Rate) ÷ (kg × 6)",
        options: [
          "5.6 mg/kg/min",
          "7.0 mg/kg/min",
          "8.4 mg/kg/min",
          "10.5 mg/kg/min"
        ],
        answer: 1,
        pearl: "Rate = (120 × 3) ÷ 24 = 15 mL/hr. GIR = (8.4 × 15) ÷ (3 × 6) = 126 ÷ 18 = 7.0 mg/kg/min. Remember milk carbohydrate percentages from PIER: breast milk (lactose) = 7.2%, Nutriprem 2 = 7.2%, Nutriprem 1 = 8.4%."
      },
      {
        id: "q5",
        domain: "definitions",
        source: "pier",
        type: "mcq",
        section: "Worked GIR Example • High-Concentration IV",
        vignette: "A 3.6 kg neonate requires IV 15% dextrose at 150 mL/kg/day (22.5 mL/hr) to keep blood glucose > 3.5 mmol/L.",
        prompt: "What is this baby's GIR, and how does it compare to the CHI threshold?",
        formulaHint: "GIR = (% glucose × Rate mL/hr) ÷ (Weight kg × 6)",
        options: [
          "10.4 mg/kg/min — meets CHI threshold (> 8 mg/kg/min)",
          "12.5 mg/kg/min — meets CHI threshold (> 8 mg/kg/min)",
          "15.6 mg/kg/min — meets CHI threshold (> 8 mg/kg/min)",
          "7.8 mg/kg/min — below CHI threshold"
        ],
        answer: 2,
        pearl: "GIR = (15 × 22.5) ÷ (3.6 × 6) = 337.5 ÷ 21.6 = 15.6 mg/kg/min — nearly double the 8 mg/kg/min CHI threshold. (Note from UK Consensus: UK minimal incidence of persistent CHI > 6 months is 1 in 28,389 live births.)"
      },

      /* 2. DIAGNOSIS & GENETICS (7) */
      {
        id: "q6",
        domain: "diagnosis",
        source: "both",
        type: "mcq",
        section: "Transitional Hypoglycaemia vs Early CHI Red Flags",
        prompt: "How should clinicians balance normal transitional hypoglycaemia (first 48–72 hours) against early recognition of CHI?",
        options: [
          "Never investigate or suspect CHI before 72 hours of life",
          "Repeat an early hypo screen after 48–72 h if hypoglycaemia persists, BUT suspect CHI even within 48 h if there is severe/recurrent hypoglycaemia, undetectable BG, or ≥ 2 episodes < 3.0 mmol/L with GIR > 8 mg/kg/min",
          "Start diazoxide in all neonates with any BG < 2.6 mmol/L in the first 24 hours",
          "Transitional hypoglycaemia is always strongly ketotic, so low ketones at 12 hours proves permanent genetic CHI"
        ],
        answer: 1,
        pearl: "Transitional hypoglycaemia is itself hypoketotic and occurs in the first 48–72 h, so early screens need repeating if hypoglycaemia persists (PIER). However, the UK Consensus stresses that severe/recurrent lows, undetectable BG at any time, or ≥ 2 episodes < 3.0 mmol/L with GIR > 8 mg/kg/min within 48 h should alert clinicians to CHI early."
      },
      {
        id: "q7",
        domain: "diagnosis",
        source: "both",
        type: "mcq",
        section: "Biochemical Criteria & Sample Collection",
        prompt: "Which biochemical profile supports CHI, and what is the top sampling priority if blood volume is very limited during acute hypoglycaemia?",
        options: [
          "BG < 3.0 mmol/L, insulin > 2 mU/L (> 12 pmol/L), C-peptide > 165.5 pmol/L, suppressed FFA & BOHB; prioritise peripheral plasma glucose and serum insulin",

    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;

    function startQuiz(mode, customQuestions = null) {

      if (customQuestions) {
        pool = customQuestions;
      } else if (mode === "case") {
        pool = CASE_SIM_QUESTIONS.map(q => ({ ...q }));
      } else if (mode === "consensus") {
        const ukOnly = QUESTION_BANK.filter(q => q.source === "uk");
        pool = shuffle(ukOnly);
      } else {
        const filtered = state.selectedDomain === "all"
          ? QUESTION_BANK
          : QUESTION_BANK.filter(q => q.domain === state.selectedDomain);
        const shuffled = shuffle(filtered);
        pool = mode === "quick" ? shuffled.slice(0, Math.min(10, shuffled.length)) : shuffled;
      }

      state.questions = pool.map(q => {
        if (q.type === "mcq") {
          const indexed = q.options.map((text, idx) => ({ text, isCorrect: idx === q.answer }));
          const mixed = shuffle(indexed);
          return {
            ...q,
            options: mixed.map(x => x.text),
            answer: mixed.findIndex(x => x.isCorrect)
          };
        }
        if (q.type === "multi") {
          const indexed = q.options.map((text, idx) => ({ text, isCorrect: q.answers.includes(idx) }));
          const mixed = shuffle(indexed);
          const newAnswers = [];
          mixed.forEach((x, idx) => { if (x.isCorrect) newAnswers.push(idx); });
          return {
            ...q,
            options: mixed.map(x => x.text),
            answers: newAnswers
          };
        }
        return { ...q };
      });

      state.currentIndex = 0;
      state.score = 0;
      state.streak = 0;
      state.bestStreak = 0;
      state.answers = [];
      state.reviewFilter = "all";
      state.view = "quiz";

      prepareQuestion(state.questions[0]);
      render();
      startTimer();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function evaluateAnswer(timedOut = false) {
      if (state.submitted) return;
      stopTimer();
      const q = state.questions[state.currentIndex];
      let isCorrect = false;
      let userAnswer = null;

      if (!timedOut) {
        if (q.type === "mcq") {
          userAnswer = state.selectedOption;
          isCorrect = state.selectedOption === q.answer;
        } else if (q.type === "multi") {
          const picked = Array.from(state.multiSelected).sort((a, b) => a - b);
          const expected = q.answers.slice().sort((a, b) => a - b);
          userAnswer = picked;
          isCorrect = picked.length === expected.length && picked.every((v, i) => v === expected[i]);
        } else if (q.type === "slider") {
          userAnswer = Number(state.sliderValue);
          isCorrect = Math.abs(userAnswer - q.answer) <= (q.tolerance || 0);
        }
      }

      let pointsEarned = 0;
      if (isCorrect) {
        state.streak += 1;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
        const streakBonus = (state.streak - 1) * 25;

        pointsEarned = 100 + streakBonus + timeBonus;
        state.score += pointsEarned;
      } else {
        state.streak = 0;
      }

      state.submitted = true;
      state.lastCorrect = isCorrect;
      state.lastPoints = pointsEarned;
      state.answers.push({
        question: q,
        domain: q.domain,
        isCorrect,
        timedOut,
        userAnswer,
        pointsEarned
      });

            ${q.options.map((opt, idx) => {
              const isPicked = state.multiSelected.has(idx);
              const isExpected = q.answers.includes(idx);
              let cls = "option-btn";
              let marker = isPicked ? "✓" : letters[idx];
              if (!state.submitted) {
                if (isPicked) cls += " selected";
              } else {
                if (isExpected && isPicked) { cls += " correct"; marker = "✓"; }
                else if (!isExpected && isPicked) { cls += " incorrect"; marker = "✕"; }
                else if (isExpected && !isPicked) { cls += " missed"; marker = "!"; }
              }
              return `
                <button type="button" data-multi="${idx}" class="${cls}" ${state.submitted ? "disabled" : ""}>
                  <span class="option-key">${marker}</span>
                  <span>${escapeHtml(opt)}</span>
                </button>
              `;
            }).join("")}
          </div>
        `;
      } else if (q.type === "slider") {
        const displayVal = Number(state.sliderValue);
        const answerDisplay = (q.prefix ? q.prefix + " " : "") + q.answer + " " + q.unit;
        interactionHtml = `
          <div class="surface-subtle stack-md">
            <div class="row-between">
              <span class="section-label">Your Threshold</span>
              <span id="slider-readout" class="font-bold tabular text-primary" style="font-size: 24px;">
                ${q.prefix ? escapeHtml(q.prefix) + " " : ""}${displayVal}
                <span class="body-sm font-semibold text-muted">${escapeHtml(q.unit)}</span>
              </span>
            </div>
            <input
              id="threshold-slider"
              type="range"
              min="${q.min}"
              max="${q.max}"
              step="${q.step}"
              value="${displayVal}"
              class="range-slider"
              ${state.submitted ? "disabled" : ""}
              aria-label="Select threshold value"
            />
            <div class="row-between body-xs text-muted tabular">
              <span>${q.prefix ? q.prefix + " " : ""}${q.min} ${escapeHtml(q.unit)}</span>
              <span>${q.prefix ? q.prefix + " " : ""}${q.max} ${escapeHtml(q.unit)}</span>
            </div>
            ${state.submitted ? `
              <div class="divider-top row-between body-sm">
                <span class="text-muted">Guideline value:</span>
                <strong class="tabular text-success">${escapeHtml(answerDisplay)}</strong>
              </div>
            ` : ""}
          </div>
        `;
      }

      const canSubmit = !state.submitted && (
        (q.type === "mcq" && state.selectedOption !== null) ||
        (q.type === "multi" && state.multiSelected.size > 0) ||
        (q.type === "slider")
      );

      let feedbackHtml = "";
      if (state.submitted) {
        const lastRec = state.answers[state.answers.length - 1];
        const heading = lastRec.timedOut
          ? "Time's up"
          : state.lastCorrect
            ? `Correct${state.lastPoints ? ` • +${state.lastPoints} pts` : ""}`
            : "Not quite — clinical pearl";
        feedbackHtml = `
          <div class="feedback-box ${state.lastCorrect ? "feedback-correct" : "feedback-wrong"} stack-xs">
            <div class="row-between" style="flex-wrap: wrap;">
              <strong class="body-sm font-bold ${state.lastCorrect ? "text-success" : "text-error"}">
                ${escapeHtml(heading)}
              </strong>
              ${renderSourceBadge(q.source)}
            </div>
            <p class="body-sm">${escapeHtml(q.pearl)}</p>
          </div>
        `;
      }

      return `
        <div class="stack-md">
          <div class="sticky-hud stack-sm">
            <div class="row-between">
              <button id="quit-btn" type="button" class="btn-secondary">← Exit</button>
              <div class="row body-xs font-bold tabular">
                <span class="text-muted">Q ${state.currentIndex + 1}/${total}</span>
                ${state.streak >= 2 ? `<span class="text-warning">🔥 ${state.streak}</span>` : ""}
                <span class="text-primary">${state.score} pts</span>
              </div>
            </div>

            <div class="progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-fill" style="width: ${pct}%;"></div>
            </div>

            ${state.blitzTimer ? `
              <div class="row">
                <div class="progress-track flex-1" style="height: 4px;">
                  <div id="timer-bar-fill" class="timer-fill" style="width: ${(state.timeLeft / 30) * 100}%; background-color: var(--primary);"></div>
                </div>
                <span id="timer-label" class="body-xs mono tabular text-muted" style="width: 28px; text-align: right;">${state.timeLeft}s</span>
              </div>
            ` : ""}
          </div>

          <article class="surface-card stack-md view-enter">
            <div class="row-between" style="flex-wrap: wrap;">
              <span class="eyebrow">${escapeHtml(q.stageLabel || domainLabel)}</span>
              <span class="body-xs text-muted">${escapeHtml(q.section)}</span>
            </div>

            ${q.vignette ? `
              <div class="surface-subtle stack-xs body-sm">
                <span class="section-label" style="display: block;">Clinical Scenario</span>
                <p>${escapeHtml(q.vignette)}</p>
              </div>
            ` : ""}

            <h2 class="title-md">${escapeHtml(q.prompt)}</h2>

            ${q.formulaHint ? `
              <div class="stack-xs">
                <button id="toggle-formula" type="button" class="btn-link">
                  ${state.showFormula ? "Hide GIR formula" : "Need the GIR formula?"}
                </button>
                ${state.showFormula ? `
                  <div class="surface-subtle body-xs mono">${escapeHtml(q.formulaHint)}</div>
                ` : ""}
              </div>
            ` : ""}

            ${interactionHtml}
            ${feedbackHtml}

            <div class="row-between" style="padding-top: 4px;">
              <span class="kbd-hint body-xs text-muted">
                ${state.submitted ? "Press Enter to continue" : (q.type === "mcq" ? "Keys 1–4 to pick • Enter to check" : "Press Enter to check")}
              </span>
              ${!state.submitted ? `
                <button id="submit-btn" type="button" class="btn-primary btn-full-mobile" ${canSubmit ? "" : "disabled"}>
                  Check Answer
                </button>
              ` : `
                <button id="next-btn" type="button" class="btn-primary btn-full-mobile">
                  ${state.currentIndex + 1 < total ? "Next Question →" : "View Clinical Debrief →"}
                </button>
              `}
            </div>
          </article>
        </div>
      `;
    }

    function renderResults() {
      const total = state.answers.length;
      const correctCount = state.answers.filter(a => a.isCorrect).length;
      const accuracy = total ? Math.round((correctCount / total) * 100) : 0;
      const rank = getRank(accuracy);
      const missedItems = state.answers.filter(a => !a.isCorrect);

      const byDomain = {};
      state.answers.forEach(rec => {
        if (!byDomain[rec.domain]) byDomain[rec.domain] = { correct: 0, total: 0 };
        byDomain[rec.domain].total += 1;
        if (rec.isCorrect) byDomain[rec.domain].correct += 1;
      });

      const listToShow = state.reviewFilter === "missed" ? missedItems : state.answers;

      return `
        <div class="view-enter stack-lg">
          <header class="row-between">
            <button id="home-btn" type="button" class="btn-secondary">← All Modes</button>
            <button id="open-ref-btn" type="button" class="btn-secondary">Quick Reference</button>
          </header>

          <section class="surface-card stack-lg">
            <div class="stack-xs">
              <p class="eyebrow">Session Debrief • Ephemeral (Not Saved)</p>
              <h1 class="title-xl">${escapeHtml(rank.title)}</h1>
              <p class="body-sm text-muted">${escapeHtml(rank.note)}</p>
            </div>

            <div class="grid-3">
              <div class="stat-box">
                <div class="stat-num tabular text-primary">${accuracy}%</div>
                <div class="body-xs text-muted">${correctCount}/${total} correct</div>
              </div>
              <div class="stat-box">
                <div class="stat-num tabular">${state.score}</div>
                <div class="body-xs text-muted">Score</div>
              </div>
              <div class="stat-box">
                <div class="stat-num tabular">${state.bestStreak}</div>
                <div class="body-xs text-muted">Best Streak</div>
              </div>
            </div>

            <div class="stack-sm">
              <h2 class="section-label">Domain Breakdown</h2>
              <div class="stack-sm">
                ${Object.entries(byDomain).map(([domId, stats]) => {
                  const pct = Math.round((stats.correct / stats.total) * 100);
                  const barColor = pct >= 80 ? "var(--success)" : pct >= 50 ? "var(--warning)" : "var(--error)";
                  return `
                    <div class="stack-xs">
                      <div class="row-between body-xs font-semibold">
                        <span>${escapeHtml(DOMAINS[domId]?.label || domId)}</span>
                        <span class="tabular text-muted">${stats.correct}/${stats.total} (${pct}%)</span>
                      </div>
                      <div class="progress-track">
                        <div class="progress-fill" style="width: ${pct}%; background-color: ${barColor};"></div>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>

            <div class="row-wrap">
              ${missedItems.length > 0 ? `
                <button id="retry-missed-btn" type="button" class="btn-primary">
                  Retry ${missedItems.length} Missed
                </button>
              ` : ""}
              <button id="play-again-btn" type="button" class="${missedItems.length > 0 ? "btn-secondary" : "btn-primary"}">
                New Shuffled Run
              </button>
            </div>
          </section>

          <section class="stack-sm">
            <div class="row-between" style="flex-wrap: wrap;">
              <h2 class="section-label">Clinical Pearls Review</h2>
              <div class="row-wrap">
                <button type="button" data-review="all" class="chip-btn ${state.reviewFilter === "all" ? "active" : ""}">
                  All (${total})
                </button>
                <button type="button" data-review="missed" class="chip-btn ${state.reviewFilter === "missed" ? "active" : ""}">
                  Missed (${missedItems.length})
                </button>
              </div>
            </div>

            ${listToShow.length === 0 ? `
              <div class="surface-card body-sm text-muted" style="text-align: center;">
                No missed questions in this run — clean sweep!
              </div>
            ` : listToShow.map(rec => `
              <div class="surface-card stack-xs" style="padding: 16px 18px;">
                <div class="row-between" style="flex-wrap: wrap;">
                  <span class="body-xs font-bold ${rec.isCorrect ? "text-success" : "text-error"}">
                    ${rec.isCorrect ? "✓ Correct" : (rec.timedOut ? "⏱ Timed out" : "✕ Missed")} • ${escapeHtml(rec.question.section)}
                  </span>
                  ${renderSourceBadge(rec.question.source)}
                </div>
                <p class="body-sm font-bold">${escapeHtml(rec.question.prompt)}</p>
                <p class="body-sm text-muted">${escapeHtml(rec.question.pearl)}</p>
              </div>
            `).join("")}
          </section>
        </div>
      `;
    }

    function renderRefModal() {
      if (!state.showRefModal) return "";
      return `
        <div id="ref-backdrop" class="ref-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="ref-title">
          <div class="ref-modal-panel stack-md">
            <div class="row-between" style="padding-bottom: 12px; border-bottom: 1px solid var(--border);">
              <div>
                <h2 id="ref-title" class="title-md">CHI Clinical Quick Reference</h2>
                <p class="body-xs text-muted">PIER Network (v1.0, 2024) + UK National Consensus (Shaikh et al., 2023)</p>
              </div>
              <button id="close-ref-btn" type="button" class="btn-secondary">Close</button>
            </div>

            <div class="stack-sm">
              <div class="surface-subtle">
                <h3 class="eyebrow">1. Thresholds, GIR &amp; Diagnosis</h3>
                <ul class="ref-list">
                  <li><strong>Investigate:</strong> BG ≤ 3.0 mmol/L • <strong>Treatment target:</strong> ≥ 3.5 mmol/L • <strong>Normal GIR:</strong> 4–6 mg/kg/min • <strong>Suspect CHI:</strong> GIR &gt; 8 mg/kg/min (10% dextrose at 5 mL/kg/hr = 8.3 mg/kg/min).</li>
                  <li><strong>GIR formula:</strong> (% glucose × mL/hr) ÷ (weight kg × 6). Breast milk 7.2% • Nutriprem 1 = 8.4% • Nutriprem 2 = 7.2%.</li>
                  <li><strong>Biochemistry:</strong> Insulin &gt; 2 mU/L (&gt; 12 pmol/L), C-peptide &gt; 165.5 pmol/L (≥ 0.5 ng/mL), suppressed FFA &amp; BOHB. Insulin half-life ~6 min (undetectable in up to 20% of CHI); prioritise peripheral glucose &amp; insulin if volume is small.</li>
                  <li><strong>Exogenous insulin / FII:</strong> Detectable insulin + undetectable C-peptide → test specific insulin analogues.</li>
                  <li><strong>Rapid genetics:</strong> Rapid <em>ABCC8</em> &amp; <em>KCNJ11</em> testing in diazoxide-unresponsive / high-GIR CHI to identify surgically curable focal CHI.</li>
                </ul>
              </div>

              <div class="surface-subtle">
                <h3 class="eyebrow">2. Acute Stabilisation &amp; Glucagon</h3>
                <ul class="ref-list">
                  <li><strong>Rescue:</strong> 10% glucose bolus (2 mL/kg PIER; 2.5 mL/kg initial then 1–2 mL/kg subsequent per UK Consensus) + continuous IV infusion; recheck BG in 15 min.</li>
                  <li><strong>Central venous access:</strong> Required when glucose &gt; 12.5% (15–20% centrally). Consider prophylactic <strong>enoxaparin</strong> if prolonged glucagon + ≥ 15% central glucose (coagulopathy/thrombosis risk).</li>
                  <li><strong>Fluid cap pre-diazoxide:</strong> 130 mL/kg/day (UK Consensus: 130–150 mL/kg/day × 24–48 h; avoid &gt; 150 mL/kg/day in first 2 weeks); 120 mL/kg/day in preterm neonates.</li>
                  <li><strong>Glucagon infusion:</strong> Start 2.5–5 mcg/kg/hr (step up 2.5, max 20). Dilute in 0.9% NaCl or 5% dextrose; change set q12h (12–24 h); avoid line filters &amp; PN / &gt; 15% dextrose in same line; rotate SC site q3d. Risks: occlusion, NME, coagulopathy.</li>
                </ul>
              </div>

              <div class="surface-subtle">
                <h3 class="eyebrow">3. Diazoxide, Chlorothiazide &amp; Octreotide</h3>
                <ul class="ref-list">
                  <li><strong>Diazoxide (1st line):</strong> Opens K-ATP (SUR1). Start 2–5 mg/kg/day in 2–3 divided doses (max 20; &gt; 15 rarely effective — stop abruptly if unresponsive). Pre-start: Endocrine discussion, fluid restriction, baseline ECHO (repeat 10–14 d if concerns). Monitor FBC, U&amp;Es, urate q4–6m.</li>
                  <li><strong>Pulmonary HTN (2–7%):</strong> STOP diazoxide immediately (dose reduction is ineffective), restrict fluids, urgent cardiology review.</li>
                  <li><strong>Network escalation:</strong> Diazoxide <strong>≥ 7 mg/kg/day</strong>, side effects, persistent IV dextrose, or octreotide need → discuss transfer with specialist CHI centre.</li>
                  <li><strong>Chlorothiazide:</strong> 7 mg/kg/day ÷ 2 (3–5 mg/kg BD); risk: hyponatraemia. Can stop &gt; 1 yr if diazoxide &lt; 5 mg/kg/day. Let stable children "outgrow the dose"; consider active wean &lt; 2–3 mg/kg/day.</li>
                  <li><strong>Octreotide (2nd line, CHI centre):</strong> Start 5 mcg/kg/day SC q6–8h or pump (max 30); tachyphylaxis at ~48 h. Pre-start: Abdo US &amp; LFTs. Monitor LFTs, TFTs, growth, annual Abdo US. Risks: NEC, gallstones/sludge, GH suppression. Long-acting LAR/Lanreotide &gt; 6 months.</li>
                </ul>
              </div>

              <div class="surface-subtle">
                <h3 class="eyebrow">4. Nutrition, Feeding &amp; MDT</h3>
                <ul class="ref-list">
                  <li><strong>Glucose polymers (dietitian-led):</strong> Start 1–2.5%, increase 1–2% q48h to max 5% added — <strong>never &gt; 12.5% total carbohydrate</strong>. Extreme caution if NEC risk.</li>
                  <li><strong>Protein:Energy ratio:</strong> Maintain <strong>7.5–12%</strong>. Breast milk is low in protein → consider preterm breast milk fortifiers (hospital supply) or Protifar.</li>
                  <li><strong>Continuous home feeds:</strong> Prefer gastrostomy over NG tube + spare pump + night alarm proximity + optional CGM alarm.</li>
                  <li><strong>Weaning &amp; Cornstarch:</strong> Complex carbs by 6 months (avoid sugary purees). Uncooked cornstarch preferred <strong>&gt; 2 years</strong> (0.5–2 g/kg/dose, room-temp liquid). Early SLT for oral aversion.</li>
                </ul>
              </div>

              <div class="surface-subtle">
                <h3 class="eyebrow">5. Surgery, Discharge &amp; CGM</h3>
                <ul class="ref-list">
                  <li><strong>Surgery:</strong> Focal CHI (18F-DOPA PET-CT/MR) → curative <strong>lesionectomy</strong>. Diffuse CHI → <strong>subtotal pancreatectomy</strong> only as last resort (high risk of post-pancreatectomy diabetes &amp; exocrine insufficiency).</li>
                  <li><strong>6-hour safety fast:</strong> 1-to-1 nursing, IV access in situ, hourly BG past normal feed interval. Pass: &gt; 3.5 mmol/L on diazoxide (&gt; 3.0 if weaned off).</li>
                  <li><strong>Home plan &amp; CGM:</strong> Open ward access, BD fingerpricks (TDS + symptomatic if unwell), max 6 h fast, target 3.5–8 mmol/L, GlucoGel if &lt; 3.5 &amp; ring hospital (also ring if persistently &gt; 8), 6- &amp; 12-week local review, endocrine clinic &amp; ongoing neurodevelopmental review. <strong>CGM is an adjunct only — verify every CGM low with a fingerprick test!</strong></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      let bodyHtml = "";
      if (state.view === "home") bodyHtml = renderHome();
      else if (state.view === "quiz") bodyHtml = renderQuiz();
      else if (state.view === "results") bodyHtml = renderResults();

      app.innerHTML = bodyHtml + renderRefModal();
      bindEvents();
    }

    function bindEvents() {
      document.getElementById("open-ref-btn")?.addEventListener("click", () => {
        state.showRefModal = true;
        render();
      });
      document.getElementById("close-ref-btn")?.addEventListener("click", () => {
        state.showRefModal = false;
        render();
      });
      const refBackdrop = document.getElementById("ref-backdrop");
      if (refBackdrop) {
        refBackdrop.addEventListener("click", (e) => {
          if (e.target === refBackdrop) {
            state.showRefModal = false;
            render();
          }
        });
      }

      if (state.view === "home") {
        const timerToggle = document.getElementById("toggle-timer");
        if (timerToggle) {
          timerToggle.addEventListener("change", (e) => {
            state.blitzTimer = e.target.checked;
          });
        }
        document.querySelectorAll("[data-domain]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.selectedDomain = btn.getAttribute("data-domain");
            render();
          });
        });
        document.getElementById("start-quick")?.addEventListener("click", () => startQuiz("quick"));
        document.getElementById("start-case")?.addEventListener("click", () => startQuiz("case"));
        document.getElementById("start-consensus")?.addEventListener("click", () => startQuiz("consensus"));
        document.getElementById("start-full")?.addEventListener("click", () => startQuiz("full"));
      }

      if (state.view === "quiz") {
        document.getElementById("quit-btn")?.addEventListener("click", goHome);

        document.getElementById("toggle-formula")?.addEventListener("click", () => {
          state.showFormula = !state.showFormula;
          render();
        });

        document.querySelectorAll("[data-mcq]").forEach(btn => {
          btn.addEventListener("click", () => {
            if (state.submitted) return;
            state.selectedOption = Number(btn.getAttribute("data-mcq"));
            render();
          });
        });

        document.querySelectorAll("[data-multi]").forEach(btn => {
          btn.addEventListener("click", () => {
            if (state.submitted) return;
            const idx = Number(btn.getAttribute("data-multi"));
            if (state.multiSelected.has(idx)) state.multiSelected.delete(idx);
            else state.multiSelected.add(idx);
            render();
          });
        });

        const slider = document.getElementById("threshold-slider");
        if (slider) {
          slider.addEventListener("input", (e) => {
            const q = state.questions[state.currentIndex];
            state.sliderValue = Number(e.target.value);
            const readout = document.getElementById("slider-readout");
            if (readout) {
              readout.innerHTML = `${q.prefix ? escapeHtml(q.prefix) + " " : ""}${state.sliderValue} <span class="body-sm font-semibold text-muted">${escapeHtml(q.unit)}</span>`;
            }
          });
        }

        document.getElementById("submit-btn")?.addEventListener("click", () => evaluateAnswer(false));
        document.getElementById("next-btn")?.addEventListener("click", nextQuestion);
      }

      if (state.view === "results") {
        document.getElementById("home-btn")?.addEventListener("click", goHome);
        document.getElementById("play-again-btn")?.addEventListener("click", () => {
          startQuiz(state.mode === "retry" ? "quick" : state.mode);
        });
        document.getElementById("retry-missed-btn")?.addEventListener("click", () => {
          const missedQs = state.answers.filter(a => !a.isCorrect).map(a => a.question);
          if (missedQs.length) startQuiz("retry", missedQs);
        });
        document.querySelectorAll("[data-review]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.reviewFilter = btn.getAttribute("data-review");
            render();
          });
        });
      }
    }

    document.addEventListener("keydown", (e) => {
      if (state.showRefModal) {
        if (e.key === "Escape") {
          state.showRefModal = false;
          render();
        }
        return;
      }

      if (state.view !== "quiz") return;
      const q = state.questions[state.currentIndex];

      if (!state.submitted && (q.type === "mcq" || q.type === "multi")) {
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= q.options.length) {
          const idx = num - 1;
          if (q.type === "mcq") {
            state.selectedOption = idx;
          } else {
            if (state.multiSelected.has(idx)) state.multiSelected.delete(idx);
            else state.multiSelected.add(idx);
          }
          render();
          return;
        }
      }

      if (e.key === "Enter") {
        if (!state.submitted) {
          const canSubmit =
            (q.type === "mcq" && state.selectedOption !== null) ||
            (q.type === "multi" && state.multiSelected.size > 0) ||
            (q.type === "slider");
          if (canSubmit) {
            e.preventDefault();
            evaluateAnswer(false);
          }
        } else {
          e.preventDefault();
          nextQuestion();
        }
      }
    });

    render();
  </script>
</body>
</html>
